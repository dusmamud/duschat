# Deploy Dus Chat to Cloudflare Pages
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL       — Supabase project URL
#   VITE_SUPABASE_ANON_KEY  — Supabase publishable/anon key (never the service_role key)
#   CLOUDFLARE_API_TOKEN    — Cloudflare API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID   — Cloudflare account ID
#
# The Pages project name below (`duschat`) serves the site at duschat.pages.dev.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=duschat
